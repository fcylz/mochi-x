name: verify

# 每次 push / PR 自动跑构建 + 打回体检，并在「本地校验脚本已入库」时补跑三套验证
# （Chrome 布局 / WebKit 引擎 / 设备伪装回归）与 verify:all 套件。
# 防止「改完就发、发完才发现坏」——失败会标红，构建者提交前就能看到。
# 注意：本工作流只验证产物正确性，不构建、不部署（部署仍是构建者手动 node build.mjs）。
#
# v3.28.x 可入库性修正：.gitignore 把 tools/* 整体排除（几百个本地校验脚本，与线上无关），
# 只有 tools/verify-worktree-revert.mjs 是 build.mjs 写产物前「打回体检」的硬依赖，已强制入库。
# 其余 verify-*.mjs 不入库，故 CI 上分为两类：
#   ① 无条件必跑：构建（build.mjs 内置体检）+ 显式打回体检 → 公开仓库永远有真实门禁；
#   ② 有条件跑：脚本在库时才执行（hashFiles 判空即 skip，不再因文件缺失整条 CI 标红）。
# 将来把某个脚本入库，CI 会自动恢复对应步骤，无需再改本文件。

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 WebKit 引擎（Playwright）
        if: hashFiles('tools/verify-webkit.mjs') != ''
        run: npx playwright install --with-deps webkit

      # 构建前打回体检（#1213）：校验工作树的修复登记项没有停在旧底。build.mjs 内部也会
      # 跑一次并作为硬闸，这里显式跑一遍是为了在 CI 日志里单独可见、失败原因不被构建输出淹没。
      - name: 构建前打回体检（硬依赖 · 已入库）
        run: node tools/verify-worktree-revert.mjs

      - name: 构建
        run: node build.mjs

      - name: 哨兵锚点校验（不写产物）
        run: node build.mjs --check-sentinels

      - name: Chrome 布局验证
        if: hashFiles('tools/verify.mjs') != ''
        run: node tools/verify.mjs

      - name: WebKit 引擎验证
        if: hashFiles('tools/verify-webkit.mjs') != ''
        run: node tools/verify-webkit.mjs

      - name: 设备伪装场景回归
        if: hashFiles('tools/verify-device-regression.mjs') != ''
        run: node tools/verify-device-regression.mjs

      - name: 全部回归脚本（verify:all 套件，失败可见性报告）
        if: hashFiles('tools/verify-suite.mjs') != ''
        run: node tools/verify-suite.mjs --tail 12
